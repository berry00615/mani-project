# StackCube Stage 1: native ManiSkill dense-reward baseline.
# This is intentionally independent of all PickCube configs/checkpoints.
# Launch on the physical GPU 1 with CUDA_VISIBLE_DEVICES=1.

env_id: StackCube-v1
obs_mode: state
render_mode: null
render_backend: none
sim_backend: auto
num_envs: 256
seed: 0
enable_shadow: false

# The native StackCube-v1 dense reward already implements the task phases:
# reach cube A -> grasp -> move above cube B -> release and become static.
total_timesteps: 2000000
learning_rate: 0.0003
n_steps: 64
batch_size: 1024
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5

policy_hidden_sizes:
  - 256
  - 256
  - 256
value_hidden_sizes:
  - 256
  - 256
  - 256

checkpoint_interval: 100000
output_dir: checkpoints/ppo_stack_cube_stage1_baseline_gpu1_2m
log_dir: logs/ppo_stack_cube_stage1_baseline_gpu1_2m
eval_interval: 100000
eval_episodes: 20
device: cuda
