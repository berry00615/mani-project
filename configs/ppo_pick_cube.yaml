# Safe default configuration for smoke tests and baseline training.
env_id: PickCube-v1
obs_mode: state
render_mode: null
render_backend: none
sim_backend: auto
num_envs: 64
seed: 0
enable_shadow: false

total_timesteps: 100000
learning_rate: 0.0003
n_steps: 64
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
policy_hidden_sizes: [256, 256, 256]
value_hidden_sizes: [256, 256, 256]
checkpoint_interval: 10000
eval_interval: 10000
eval_episodes: 20
output_dir: checkpoints/ppo_pick_cube
log_dir: logs/ppo_pick_cube
device: auto
