learning_rate: 0.00003
n_steps: 64
batch_size: 1024
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
policy_hidden_sizes: [256, 256, 256]
value_hidden_sizes: [256, 256, 256]
checkpoint_interval: 50000
output_dir: checkpoints/ppo_stack_cube_stage5_stable_release_gpu1_500k
